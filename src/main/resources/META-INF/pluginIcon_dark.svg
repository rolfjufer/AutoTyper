<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Keyboard key background -->
  <rect x="4" y="6" width="32" height="28" rx="4" ry="4" fill="#3C3F41" stroke="#5E6060" stroke-width="1"/>
  <rect x="6" y="7" width="28" height="24" rx="3" ry="3" fill="#2B2B2B"/>
  <!-- Play/typing arrow -->
  <polygon points="16,12 16,28 28,20" fill="#589DF6"/>
  <!-- Small cursor line -->
  <rect x="30" y="12" width="2" height="16" rx="1" fill="#589DF6" opacity="0.6"/>
</svg>
