<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Keyboard key background -->
  <rect x="4" y="6" width="32" height="28" rx="4" ry="4" fill="#2B2B2B" stroke="#3C3F41" stroke-width="1"/>
  <rect x="6" y="7" width="28" height="24" rx="3" ry="3" fill="#F5F5F5"/>
  <!-- Play/typing arrow -->
  <polygon points="16,12 16,28 28,20" fill="#3574F0"/>
  <!-- Small cursor line -->
